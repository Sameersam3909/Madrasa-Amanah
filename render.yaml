services:
  - type: web
    name: madrasa-attendance-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_URI_PRIMARY
        sync: false
      - key: MONGODB_URI_SECONDARY
        sync: false
      - key: DATABASE_STORAGE_WARNING_PERCENT
        value: "70"
      - key: DATABASE_STORAGE_CRITICAL_PERCENT
        value: "85"
      - key: DATABASE_ROTATION_ENABLED
        value: "false"
      - key: PRIMARY_STORAGE_LIMIT_MB
        value: "512"
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ADMIN_NAME
        value: Madrasa Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Weekly report recipient — default is 2300030621cseh1@gmail.com
      # Administrators can override this in Settings → Weekly Report Recipient Email
      - key: REPORT_RECIPIENT_EMAIL
        value: 2300030621cseh1@gmail.com
      - key: REPORT_TIMEZONE
        value: Asia/Kolkata
      # SMTP configuration for weekly email reports
      # Use your Gmail address for SMTP_USER
      # Use a Gmail App Password (not your account password) for SMTP_PASS
      # See: https://myaccount.google.com/apppasswords
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: BACKUP_SERVICE_TOKEN
        sync: false

