<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5C42"/>
      <stop offset="100%" stop-color="#123B2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A759"/>
      <stop offset="100%" stop-color="#9B7030"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#gem)"/>
  <!-- Subtle Octagram Star in Gold Accent -->
  <g transform="translate(256, 256)" stroke="url(#gold)" stroke-width="6" fill="none" opacity="0.35">
    <rect x="-140" y="-140" width="280" height="280" rx="20"/>
    <rect x="-140" y="-140" width="280" height="280" rx="20" transform="rotate(45)"/>
  </g>
  <!-- Open Book Symbol -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 156)">
    <!-- Left page -->
    <path d="M 150 180 C 90 140, 20 150, 0 160 L 0 30 C 20 20, 90 10, 150 50 Z" fill="#F7F6F0" fill-opacity="0.95" stroke="#174B36" stroke-width="12"/>
    <!-- Right page -->
    <path d="M 150 180 C 210 140, 280 150, 300 160 L 300 30 C 280 20, 210 10, 150 50 Z" fill="#F7F6F0" fill-opacity="0.95" stroke="#174B36" stroke-width="12"/>
    <!-- Spine divider in gold -->
    <line x1="150" y1="50" x2="150" y2="186" stroke="url(#gold)" stroke-width="14"/>
  </g>
  <!-- Subtle Crescent / Trust emblem above -->
  <circle cx="256" cy="150" r="14" fill="#D4A759"/>
</svg>
